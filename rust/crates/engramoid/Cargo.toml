[package]
name = "engramoid"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "engramoid — in-process knowledge-graph + retrieval substrate for pathgram (ported from kent8192/engramoid Phase 1)"

[lints]
workspace = true

[features]
default = []
eval = ["dep:git2", "dep:regex", "dep:clap", "dep:rand", "dep:walkdir", "dep:tempfile"]
eval-offline = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
petgraph = "0.6"
thiserror = "1"

# eval feature
git2 = { version = "0.19", optional = true, default-features = false, features = ["vendored-libgit2"] }
regex = { version = "1", optional = true }
clap = { version = "4.5", optional = true, features = ["derive"] }
rand = { version = "0.8", optional = true }
walkdir = { version = "2", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
serial_test = "3"

[[bin]]
name = "engramoid-eval"
path = "bin/eval_runner.rs"
required-features = ["eval"]
